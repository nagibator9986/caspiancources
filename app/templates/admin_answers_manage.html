{% extends "base.html" %}
{% block title %}Ответы на вопрос{% endblock %}
{% block content %}
<h1 class="mb-2 text-xl font-semibold text-slate-900">Ответы на вопрос</h1>
<p class="mb-4 text-xs text-slate-500">
  {{ question.text }}
</p>

<form method="post" class="space-y-4 max-w-lg rounded-3xl bg-white p-5 shadow-sm ring-1 ring-slate-100">
  {% for i in range(4) %}
    {% set opt = options[i] %}
    <div class="rounded-2xl bg-slate-50 p-3">
      <p class="mb-1 text-[11px] font-semibold text-slate-500">Вариант {{ i + 1 }}</p>
      <input
        type="text"
        name="opt_text_{{ i + 1 }}"
        value="{{ opt.text if opt else '' }}"
        class="mb-2 w-full rounded-xl border border-slate-200 bg-white px-3 py-2 text-xs">
      <label class="inline-flex items-center gap-2 text-[11px] text-slate-600">
        <input type="checkbox" name="opt_correct_{{ i + 1 }}" {% if opt and opt.is_correct %}checked{% endif %}>
        Правильный ответ
      </label>
    </div>
  {% endfor %}

  <button
    class="rounded-full bg-primary-600 px-4 py-2 text-xs font-medium text-white hover:bg-primary-700">
    Сохранить варианты
  </button>
</form>
{% endblock %}
